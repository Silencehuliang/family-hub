# Deploy:推送到 main 分支自动构建部署
name: Deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ── 检查 ──────────────────────────────────────────────
      - name: Lint + Typecheck
        run: |
          pnpm --filter @family-hub/shared run typecheck
          pnpm --filter @family-hub/api run lint
          pnpm --filter @family-hub/web run lint

      # ── 构建前端 ──────────────────────────────────────────
      - name: Build web
        run: pnpm --filter @family-hub/web run build

      # ── 部署 Workers ─────────────────────────────────────
      - name: Deploy Workers
        run: pnpm --filter @family-hub/api exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # ── 应用数据库迁移 ───────────────────────────────────
      - name: Apply D1 migrations
        run: pnpm --filter @family-hub/api exec wrangler d1 migrations apply family-hub --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # ── 部署前端(可选:也可在 Cloudflare Dashboard 绑 GitHub 自动构建)──
