# CI:PR 和 push 触发,只检查不部署
name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

jobs:
  check:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (shared)
        run: pnpm --filter @family-hub/shared run typecheck

      - name: Lint (api)
        run: pnpm --filter @family-hub/api run lint

      - name: Lint (web)
        run: pnpm --filter @family-hub/web run lint

      - name: Build (web)
        run: pnpm --filter @family-hub/web run build

      - name: Verify Workers build (dry-run)
        run: pnpm --filter @family-hub/api exec wrangler deploy --dry-run --outdir=dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
